name: Mirror to GitLab

on:
  push:
    branches:
      - 'chore/#105'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to mirror (GitLab에 푸시할 브랜치)'
        required: true
        default: 'develop'
        type: string
      dry_run:
        description: 'Dry run (실제 푸시 없이 테스트만)'
        required: false
        default: false
        type: boolean

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Setup GitLab remote
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          echo "🔧 Setting up GitLab remote..."
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@${GITLAB_URL}
          echo "✅ GitLab remote configured"
          git remote -v

      - name: Test connection
        run: |
          echo "🔍 Testing GitLab connection..."
          git ls-remote gitlab || echo "Repository might be empty"
          echo "✅ Connection test completed!"

      # workflow_dispatch이고 dry_run이 true일 때만 dry-run
      - name: Dry Run - Test Only
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          echo "🧪 DRY RUN MODE - No actual push will be performed"
          echo "Branch: ${{ github.event.inputs.branch }}"
          echo "GitLab URL: ${{ secrets.GITLAB_URL }}"
          echo "Command that would run: git push gitlab ${{ github.event.inputs.branch }} --force"
          echo "✅ Dry run completed - Configuration is valid!"

      # push 이벤트이거나 (workflow_dispatch이고 dry_run이 false)일 때 실제 푸시
      - name: Push to GitLab
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        run: |
          BRANCH_NAME=${{ github.event.inputs.branch || github.ref_name }}
          echo "🔄 Pushing ${BRANCH_NAME} to GitLab..."
          git push gitlab ${BRANCH_NAME} --force
          echo "✅ Successfully mirrored ${BRANCH_NAME} to GitLab!"